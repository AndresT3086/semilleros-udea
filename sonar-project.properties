# ============================================================
# sonar-project.properties
# Configuración de SonarCloud para el proyecto
# ============================================================

sonar.projectKey=udea-semilleros
sonar.organization=udea-investigacion
sonar.projectName=Sistema de Semilleros de Investigación UdeA
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusiones de cobertura
sonar.coverage.exclusions=\
  **/SemillerosApplication.java,\
  **/infrastructure/adapter/out/persistence/entity/**,\
  **/infrastructure/adapter/in/rest/dto/**,\
  **/domain/model/**,\
  **/infrastructure/config/OpenApiConfig.java

# Exclusiones de análisis de código
sonar.exclusions=\
  **/target/**,\
  **/*.xml,\
  **/*.properties

sonar.sourceEncoding=UTF-8
sonar.java.source=21
