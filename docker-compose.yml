version: "3.9"

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: semilleros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-semilleros_dev}
      POSTGRES_USER:     ${DB_USERNAME:-semilleros_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semilleros_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-semilleros_user} -d ${DB_NAME:-semilleros_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semilleros-net

  # ─── MailHog (servidor de correo local para desarrollo) ───────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: semilleros-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI Web
    networks:
      - semilleros-net

volumes:
  postgres_data:
    name: semilleros_postgres_data

networks:
  semilleros-net:
    name: semilleros-network
    driver: bridge
