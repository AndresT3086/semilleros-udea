version: "3.9"

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: semilleros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-semilleros_dev}
      POSTGRES_USER:     ${DB_USERNAME:-semilleros_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semilleros_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-semilleros_user} -d ${DB_NAME:-semilleros_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semilleros-net

  # ─── MailHog (servidor de correo local para desarrollo) ───────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: semilleros-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI Web
    networks:
      - semilleros-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semilleros-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:  ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL:                  jdbc:postgresql://postgres:5432/${DB_NAME:-semilleros_dev}
      DB_USERNAME:             ${DB_USERNAME:-semilleros_user}
      DB_PASSWORD:             ${DB_PASSWORD:-semilleros_pass}
      JWT_SECRET:              ${JWT_SECRET}
      JWT_EXPIRATION_MS:       ${JWT_EXPIRATION_MS:-86400000}
      MAIL_HOST:               mailhog
      MAIL_PORT:               1025
      MAIL_USERNAME:           ""
      MAIL_PASSWORD:           ""
      # Los correos salen por la API de SendGrid: sin esta clave no se envía nada
      SENDGRID_API_KEY:        ${SENDGRID_API_KEY:-}
      MAIL_FROM:               ${MAIL_FROM:-darwin.tangarife@udea.edu.co}
      MAIL_FROM_NAME:          ${MAIL_FROM_NAME:-Sistema de Semilleros de Investigacion UdeA}
      # Base de los enlaces de verificación y activación que llegan por correo
      FRONTEND_URL:            ${FRONTEND_URL:-http://localhost:5173}
      APP_ADMIN_CORREO:        ${APP_ADMIN_CORREO:-admin@udea.edu.co}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - semilleros-net

volumes:
  postgres_data:
    name: semilleros_postgres_data

networks:
  semilleros-net:
    name: semilleros-network
    driver: bridge
