# ============================================================
# TEST PROFILE - Pruebas unitarias e integración
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:semilleros_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

app.security.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-testing
app.security.jwt.expiration-ms=3600000
app.security.allowed-email-domain=@udea.edu.co

spring.mail.host=localhost
spring.mail.port=1025

logging.level.root=WARN
logging.level.co.udea.semilleros=ERROR
