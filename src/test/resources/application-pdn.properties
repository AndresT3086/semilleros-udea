# =======================================
# PDN PROFILE - PRODUCTION (Railway)
# =======================================

# Base de datos
# Railway provee DATABASE_URL en formato postgres://user:pass@host:port/db
# Spring Boot necesita jdbc:postgresql:// por eso la traducimos manualmente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Correo
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin
app.admin.correo=${APP_ADMIN_CORREO:admin@udea.edu.co}

# Tomcat
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=8000
server.tomcat.accept-count=200
server.tomcat.connection-timeout=20000

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Logging
logging.level.root=ERROR
logging.level.co.udea.semilleros=WARN

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never