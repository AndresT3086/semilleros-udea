# =======================================
# PDN PROFILE - PRODUCTION
# =======================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT:30000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.mail.sendgrid.api-key=${SENDGRID_API_KEY:}
app.mail.from=${MAIL_FROM:darwin.tangarife@udea.edu.co}
app.mail.from-name=${MAIL_FROM_NAME:Sistema de Semilleros de Investigación UdeA}

logging.level.root=ERROR
logging.level.co.udea.semilleros=WARN

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
