spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.security.jwt.secret=${JWT_SECRET}

app.mail.sendgrid.api-key=${SENDGRID_API_KEY:}
app.mail.from=${MAIL_FROM:darwin.tangarife@udea.edu.co}
app.mail.from-name=${MAIL_FROM_NAME:Sistema de Semilleros de Investigación UdeA}

logging.level.co.udea.semilleros=INFO
logging.level.root=WARN

management.endpoints.web.exposure.include=health,info
