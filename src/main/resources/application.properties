spring.application.name=semilleros-udea
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Pagination
app.pagination.default-page-size=15
app.pagination.max-page-size=15

# Domain validation
app.security.allowed-email-domain=@udea.edu.co
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Reportes: intervalo de verificación de cambios para actualización en tiempo real (ms)
app.reportes.eventos.intervalo-ms=${REPORTES_INTERVALO_MS:60000}

# Registro de coordinadores (solicitudes de acceso e invitaciones)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.accesos.verificacion-horas=1
app.accesos.activacion-horas=24
app.accesos.minutos-entre-envios=10
app.accesos.max-envios-dia=3
app.accesos.espera-rechazo-dias=30
# Limpieza de solicitudes sin verificar (cada hora) y resumen diario al administrador (7:00 a. m.)
app.accesos.limpieza-cron=0 0 * * * *
app.accesos.resumen-cron=0 0 7 * * *
