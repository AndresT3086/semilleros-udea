# =======================================
# DEV PROFILE - LOCAL DEVELOPMENT
# =======================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/semilleros_dev}
spring.datasource.username=${DB_USERNAME:semilleros_user}
spring.datasource.password=${DB_PASSWORD:semilleros_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.security.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

# Mail (MailHog for local)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.co.udea.semilleros=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
